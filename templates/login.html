<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ApexCare ERP</title>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">

    <div class="login-card glassmorphism">
        <div class="login-logo">
            <div class="login-icon"><i class="ph-bold ph-activity" style="color:#fff;"></i></div>
            <h2>ApexCare ERP</h2>
            <p>Sign in to your administration dashboard</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert-box alert-{{ category }}" style="font-size: .75rem; padding: 10px;">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="f-group" style="margin-bottom: 20px;">
                <label class="f-label">Username</label>
                <input type="text" name="username" class="f-control" required placeholder="Enter your username">
            </div>

            <div class="f-group" style="margin-bottom: 28px;">
                <label class="f-label">Password</label>
                <input type="password" name="password" class="f-control" required placeholder="Enter your password">
            </div>

            <button type="submit" class="btn-submit" style="width: 100%; justify-content: center; padding: 12px;">
                Sign In <i class="ph-bold ph-arrow-right"></i>
            </button>
        </form>

        <div class="login-hint">
            Default Admin: <code>admin</code> / <code>admin123</code>
        </div>
    </div>

</body>
</html>
